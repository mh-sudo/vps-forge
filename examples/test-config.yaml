# vps-forge example non-interactive config (flat "key: value" subset of YAML).
# usage: sudo ./vps-forge --yes --profile=recommended --config=examples/test-config.yaml
# REPLACE <YOUR_PUBKEY> with your own public key — the module REFUSES placeholder
# values, and shipping a real key here would give its owner SSH access to your server.
sys.timezone: UTC
sys.locale: en_US.UTF-8
sys.hostname: keep
admin.username: forge
admin.pubkey: <YOUR_PUBKEY>
admin.disable_root_login: false
ssh.port: keep
ssh.allow_tcp_forwarding: false
fw.open_ports:
f2b.backend: systemd
ua.auto_reboot: false
docker.bind_ip: 127.0.0.1
docker.ipv6: false
proxy.engine: none
backup.target: none
panel: none
totp.enabled: false
