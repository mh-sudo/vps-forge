# vps-forge module manifest — THE single registry of features.
# format: id|file|title|profiles|risk|description
#   profiles: minimal,recommended,dockerhost,custom  (membership = default selection)
#   risk: low | medium | high | critical
# Modules run in the order listed here (filename prefixes are convention).
essentials|01-essentials.sh|Base tooling|minimal,recommended,dockerhost,custom|low|curl git htop ncdu jq tmux and friends
sysbase|10-sysbase.sh|Timezone, locale, chrony NTP, hostname|minimal,recommended,dockerhost,custom|low|time sync, locale, hostname sanity
swap|11-swap.sh|Swap file (RAM-sized) + swappiness|minimal,recommended,dockerhost,custom|low|prevents OOM kills on small VPS
sysctl|12-sysctl.sh|Kernel/sysctl hardening|recommended,dockerhost,custom|low|CIS-informed kernel+network settings, Docker-safe
perf|13-perf.sh|File limits + TCP BBR|recommended,dockerhost,custom|low|nofile limits, BBR congestion control
